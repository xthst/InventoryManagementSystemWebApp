<div class="flex flex-col">
    @if (isLoading()){
    <div class="flex flex-row justify-center">
        <mat-spinner></mat-spinner>
    </div>
    } @else {
    <div class=" flex flex-row gap-4 mt-4 items-center">
        <ng-content select="[filters]"></ng-content>
    </div>

    <div class="table-container">
        <ng-content select="[table-slot]"></ng-content>
    </div>
    }

    <mat-paginator #paginator [length]="dataSource().data.length" [pageSize]="5" [showFirstLastButtons]="true"
        [pageSizeOptions]="[5, 10, 20, 50]" aria-label="Select page">
    </mat-paginator>
</div>
