<h2 mat-dialog-title>{{ dialogTitle() }}</h2>
<mat-dialog-content>
    <ng-content select="[formContent]"></ng-content>
</mat-dialog-content>

<mat-dialog-actions>
    <button matButton mat-dialog-close>Cancel</button>
    <button matButton="filled" (click)="confirmFunction()()">Confirm</button>
</mat-dialog-actions>
