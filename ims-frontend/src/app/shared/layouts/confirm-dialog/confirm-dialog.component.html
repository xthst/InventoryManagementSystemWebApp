<h2 mat-dialog-title>{{ dialogTitle() }}</h2>
<mat-dialog-content>
  <p>{{ dialogMessage() }}</p>
</mat-dialog-content>

<mat-dialog-actions>
  @if (okButtonOnly()) {
    <button matButton mat-dialog-close>Ok</button>
  }
  @else {
    <button matButton mat-dialog-close>Cancel</button>
    <button matButton="filled" [mat-dialog-close]="true">Confirm</button>
  }
</mat-dialog-actions>
