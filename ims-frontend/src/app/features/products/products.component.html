<app-table-shell [dataSource]="dataSource" [isLoading]="isLoading()">
  <ng-container filters>
    <mat-form-field class="searchBox flex-1 mb-0">
      <mat-label>Search</mat-label>
      <input matInput type="text" [value]="searchQuery()" (input)="searchQuery.set($any($event.target).value)"
        (keyup)=filterTable()>
    </mat-form-field>

    <button matButton="filled" (click)="addProduct()">Add Product</button>
  </ng-container>

  <ng-container table-slot>
    <table mat-table matSort [dataSource]="dataSource" class="mat-elevation-z8">
      <ng-container matColumnDef="id">
        <th mat-header-cell *matHeaderCellDef mat-sort-header="id"> No. </th>
        <td mat-cell *matCellDef="let product"> {{product.id}} </td>
      </ng-container>

      <ng-container matColumnDef="name">
        <th mat-header-cell *matHeaderCellDef mat-sort-header="name"> Name </th>
        <td mat-cell *matCellDef="let product"> {{product.name}} </td>
      </ng-container>

      <ng-container matColumnDef="description">
        <th mat-header-cell *matHeaderCellDef> Description </th>
        <td mat-cell *matCellDef="let product">{{ product.description}}</td>
      </ng-container>

      <ng-container matColumnDef="unitOfMeasure">
        <th mat-header-cell *matHeaderCellDef mat-sort-header="unitOfMeasure"> Unit Of Measure </th>
        <td mat-cell *matCellDef="let product">{{ product.unitOfMeasure }}</td>
      </ng-container>

      <ng-container matColumnDef="reorderPoint">
        <th mat-header-cell *matHeaderCellDef mat-sort-header="reorderPoint"> Reorder Point </th>
        <td mat-cell *matCellDef="let product">{{ product.reorderPoint }}</td>
      </ng-container>

      <ng-container matColumnDef="quantityOnHand">
        <th mat-header-cell *matHeaderCellDef mat-sort-header="quantityOnHand"> Quantity </th>
        <td mat-cell *matCellDef="let product">
          {{product.quantityOnHand + ' ' + product.unitOfMeasure}}
        </td>
      </ng-container>

      <ng-container matColumnDef="actionButtons">
        <th mat-header-cell *matHeaderCellDef>Action</th>
        <td mat-cell *matCellDef="let product">
          <div style="display: flex; gap: 8px;">
            <button matMiniFab color="primary" (click)="editProduct(product)" aria-label="Edit button">
              <mat-icon>edit</mat-icon>
            </button>
            <button matMiniFab color="warn" (click)="deleteProduct(product)" aria-label="Delete product">
              <mat-icon>delete</mat-icon>
            </button>
          </div>
        </td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="columnsToDisplay; sticky: true"></tr>
      <tr mat-row *matRowDef="let row; columns: columnsToDisplay;"></tr>

      <tr class="mat-row" *matNoDataRow>
        <td class="mat-cell" [attr.colspan]="columnsToDisplay.length">
          Nothing found.
        </td>
      </tr>
    </table>
  </ng-container>
</app-table-shell>
