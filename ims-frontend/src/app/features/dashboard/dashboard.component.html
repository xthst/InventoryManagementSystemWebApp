<mat-tab-group mat-align-tabs="center">
    <mat-tab label="Inventory">
        <ng-template matTabContent>
            <app-inventory [productData]="productData()" [isLoading]="areProductsLoading()" />
        </ng-template>
    </mat-tab>
    <mat-tab label="Products">
        <ng-template matTabContent>
            <app-products [productData]="productData()" [isLoading]="areProductsLoading()"
                (productsChanged)="fetchData()" />
        </ng-template>
    </mat-tab>
    <mat-tab label="Transactions">
        <ng-template matTabContent>
            <app-transactions [transactionData]="transactionData()" [productData]="productData()"
                [isLoading]="areTransactionsLoading()" (transactionsChanged)="fetchData()" />
        </ng-template>
    </mat-tab>
</mat-tab-group>
